name: bing-wall
base: core24
version: '3.0'
summary: Bing Wallpaper of the day to Gnome Desktop
description: |
  Little powerful utility brings Bing Wallpaper of the day to your desktop
  with ease of few clicks, Allows download wallpaper with clicks and save
  them to accessible directory.

grade: stable
confinement: strict
icon: snap/gui/icon.png
compression: lzo

platforms:
  amd64:
  arm64:

apps:
  bing-wall:
    command: usr/bin/bing-wall
    extensions: [kde-neon-6]
    desktop: usr/share/applications/bingwall.desktop
    autostart: BingWall.desktop
    plugs:
      - gsettings
      - home
      - network
      - network-status
      - opengl
      - unity7
      - wayland
      - x11

parts:
  application:
    plugin: cmake
    source: .
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
    override-build: |
      craftctl default
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/512x512/apps/bingwall.png|' ${CRAFT_PART_INSTALL}/usr/share/applications/bingwall.desktop
